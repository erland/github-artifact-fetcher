# Prepared for Coolify using a published GHCR application image and external PostgreSQL.
# Both application and migrations images must use the same GHAF_IMAGE_TAG.
# Neither service requires a source-tree bind mount.
# Coolify should route TLS to app:3000; do not expose port 3000 publicly.
services:
  migrate:
    image: ghcr.io/erland/github-artifact-fetcher-migrations:${GHAF_IMAGE_TAG:?required}
    pull_policy: always
    command: -connectRetries=30 -locations=filesystem:/flyway/sql migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://${DB_HOST:?required}:${DB_PORT:-5432}/${DB_NAME:?required}
      FLYWAY_USER: ${DB_MIGRATION_USER:?required}
      FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?required}
    restart: "no"
  app:
    image: ghcr.io/erland/github-artifact-fetcher:${GHAF_IMAGE_TAG:?set GHAF_IMAGE_TAG to a published version such as 0.5.0}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      DB_HOST: ${DB_HOST:?required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?required}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      OAUTH_ALLOWED_REDIRECT_HOSTS: ${OAUTH_ALLOWED_REDIRECT_HOSTS:?required}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?required}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
